# Render blueprint for the Emberline API (free Docker web service).
# Render → New → Blueprint → select this repo. The processed data in data/processed must be committed
# (see README "Deploy"). Then set the frontend's VITE_API_URL on Vercel to the Render URL.
services:
  - type: web
    name: emberline-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "7860"
